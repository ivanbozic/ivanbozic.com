# Quotes I've collected. Newest at the top — prepend new entries here.
- text: You've got to fail, or risk failure, to learn, to succeed. You've got to be hungry. It seems to me the job for parents is to console the failure but nurture the hunger.
  author: Bryan Cranston
  source: A Life in Parts

- text: Gentlemen, we will chase perfection, and we will chase it relentlessly, knowing all the while we can never attain it. But along the way, we shall catch excellence.
  author: Vince Lombardi

- text: Life starts all over again when it gets crisp in the fall.
  author: F. Scott Fitzgerald
  source: The Great Gatsby

- text: We often say how impressive power is. But I do not find it impressive at all. The guns and bombs, the rockets and warships, are all symbols of human failure. They are witness to human folly. A dam built across a great river is impressive … electrification of the countryside is impressive … a rich harvest in a hungry land is impressive. The sight of healthy children in a classroom is impressive.
  author: Lyndon B. Johnson

- text: After the [1967 race] riots, the media described America in very different terms. It was as if overnight an innocent child had become a middle-aged man, as if within months the soul of America had passed from childlike mirth and unreasoning optimism to deep dejection.
  author: Doris Kearns Goodwin
  source: Lyndon Johnson and the American Dream

- text: Life is like Friday on a soap opera. It gives you the illusion that everything is going to wrap up, and then the same old shit starts up on Monday.
  author: Stephen Key
  source: Duma Key

- text: What good is the warmth of summer, without the cold of winter to give it sweetness.
  author: John Steinbeck
  source: "Travels with Charley: In Search of America"

- text: Action creates information.
  author: Bryan Armstrong

- text: |
    _I knew a simple soldier boy_
    <br>
    _Who grinned at life in empty joy,_
    <br>
    _Slept soundly through the lonesome dark,_
    <br>
    _And whistled early with the lark._
    <br>
    
    _In winter trenches, cowed and glum,_
    <br>
    _With crumps and lice and lack of rum,_
    <br>
    _He put a bullet through his brain._
    <br>
    _No one spoke of him again._
    
    _You smug-faced crowds with kindling eye_
    <br>
    _Who cheer when soldier lads march by,_
    <br>
    _Sneak home and pray you'll never know_
    <br>
    _The hell where youth and laughter go._
  author: Siegfried Sassoon
  source: Suicide in the Trenches

- text: Why should someone bother to read what you didn’t bother to write?
  author: iA.net

- text: |
    I had thought that going into space would be the ultimate catharsis of that connection I had been looking for between all living things-that being up there would be the next beautiful step to understanding the harmony of the universe. In the film "Contact," when Jodie Foster's character goes to space and looks out into the heavens, she lets out an astonished whisper, "They should've sent a poet." I had a different experience, because I discovered that the beauty isn't out there, it's down here, with all of us. Leaving that behind made my connection to our tiny planet even more profound.

    It was among the strongest feelings of grief I have ever encountered. The contrast between the vicious coldness of space and the warm nurturing of Earth below filled me with overwhelming sadness. Every day, we are confronted with the knowledge of further destruction of Earth at our hands: the extinction of animal species, of flora and fauna ... things that took five billion years to evolve, and suddenly we will never see them again because of the interference of mankind. It filled me with dread. My trip to space was supposed to be a celebration; instead, it felt like a funeral.
  author: William Shatner

- text: You're only given a little spark of madness. You mustn't lose it.
  author: Robin Williams

- text: |
    Strange memories on this nervous night in Las Vegas. Five years later? Six? It seems like a lifetime, or at least a Main Era—the kind of peak that never comes again. San Francisco in the middle sixties was a very special time and place to be a part of. Maybe it meant something. Maybe not, in the long run… but no explanation, no mix of words or music or memories can touch that sense of knowing that you were there and alive in that corner of time and the world. Whatever it meant.…

    History is hard to know, because of all the hired bullshit, but even without being sure of "history" it seems entirely reasonable to think that every now and then the energy of a whole generation comes to a head in a long fine flash, for reasons that nobody really understands at the time—and which never explain, in retrospect, what actually happened.

    My central memory of that time seems to hang on one or five or maybe forty nights—or very early mornings—when I left the Fillmore half-crazy and, instead of going home, aimed the big 650 Lightning across the Bay Bridge at a hundred miles an hour wearing L. L. Bean shorts and a Butte sheepherder's jacket… booming through the Treasure Island tunnel at the lights of Oakland and Berkeley and Richmond, not quite sure which turn-off to take when I got to the other end (always stalling at the toll-gate, too twisted to find neutral while I fumbled for change)... but being absolutely certain that no matter which way I went I would come to a place where people were just as high and wild as I was: No doubt at all about that…

    There was madness in any direction, at any hour. If not across the Bay, then up the Golden Gate or down 101 to Los Altos or La Honda.… You could strike sparks anywhere. There was a fantastic universal sense that whatever we were doing was right, that we were winning.…

    And that, I think, was the handle—that sense of inevitable victory over the forces of Old and Evil. Not in any mean or military sense; we didn't need that. Our energy would simply prevail. There was no point in fighting—on our side or theirs. We had all the momentum; we were riding the crest of a high and beautiful wave.…

    So now, less than five years later, you can go up on a steep hill in Las Vegas and look West, and with the right kind of eyes you can almost see the high-water mark—that place where the wave finally broke and rolled back.
  author: Hunter S. Thompson
  source: Fear and Loathing in Las Vegas

