- text: |
    Le parole non sono come i cani cui si può fischiare a richiamarli.

    _en. Words are not like dogs which can be whistled back to heel._
  author: Leonardo Sciascia
  source: Il giorno della civetta

- text: |
    If a system is to serve the creative spirit, it must be entirely comprehensible to a single individual.

    The point here is that the human potential manifests itself in individuals. To realize this potential, we must provide a medium that can be mastered by the single individual.

    Any barrier that exists between the user and some part of the system will eventually be a barrier to creative expression.
  author: Dan Ingalls
  source: Design Principles Behind Smalltalk
